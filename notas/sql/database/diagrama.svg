<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650">
  <defs>
    <style>
      .schema { fill: none; stroke: #222; stroke-width: 2; stroke-dasharray: 7 6; }
      .schema-title { font: 700 21px Arial, sans-serif; fill: #111; }
      .table { fill: #fff; stroke: #a77bb7; stroke-width: 1.2; }
      .header { fill: #e6d9eb; stroke: #a77bb7; stroke-width: 1.2; }
      .table-name { font: italic 14px Arial, sans-serif; fill: #111; text-anchor: middle; }
      .field { font: italic 13px Arial, sans-serif; fill: #111; }
      .connector { fill: none; stroke: #333; stroke-width: 1.2; }
      .key { font: italic 11px Arial, sans-serif; fill: #6b4b79; }
    </style>
  </defs>

  <!-- Schema boundaries -->
  <text class="schema-title" x="20" y="30">sales</text>
  <rect class="schema" x="18" y="48" width="684" height="575"/>
  <text class="schema-title" x="760" y="30">temp_tables</text>
  <rect class="schema" x="755" y="48" width="545" height="575"/>

  <!-- Relationships (drawn behind tables) -->
  <path class="connector" d="M212 166 H244 V343 H275"/>
